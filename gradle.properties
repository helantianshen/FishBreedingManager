# Gradle 构建的默认堆内存，可通过命令行属性覆盖
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment 参数名与注释映射必须对应当前 Minecraft 版本
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# 当前项目仅支持 Minecraft 1.21.1，版本范围不扩展到其他版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# NeoForge 版本必须与目标 Minecraft 版本一致
neo_version=21.1.244
# FML 加载器允许的主版本范围
loader_version_range=[1,)

# 稳定模组标识必须与 @Mod 声明及资源命名空间一致
mod_id=fishbreedingmanager
mod_name=Fish Breeding Manager
# 模组发布元数据声明的许可证
mod_license=LGPL-2.1-only
# 当前模组版本用于产物与加载元数据
mod_version=0.2.0
# Maven 发布坐标的分组标识
mod_group_id=com.fishbreedingmanager
