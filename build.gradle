plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

// Wrapper 使用二进制发行包，实际版本与下载校验由 gradle-wrapper.properties 定义
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// 数据生成目录参与资源打包，模型工程文件与生成缓存不进入产物
sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")

    exclude("src/generated/**/.cache")
}

// NeoForge 提供游戏依赖仓库；测试库限定从 Maven Central 解析
repositories {
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            includeGroupByRegex 'org\\.junit.*'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
            includeGroup 'org.mockito'
            includeGroup 'net.bytebuddy'
            includeGroup 'org.objenesis'
        }
    }
}

base {
    archivesName = "neoforge-${mod_id}"
}

// 可安装产物同时标识加载器、模组、模组版本与 Minecraft 版本
tasks.named('jar', Jar).configure {
    archiveClassifier = "mc${minecraft_version}"
    from(files('LICENSE', 'NOTICE', 'TEMPLATE_LICENSE.txt')) {
        into 'META-INF'
    }
}

// Minecraft 1.21.1 使用 Java 21 工具链编译与运行
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // 在 NeoForge 测试环境加载当前模组，支持注册表相关单元测试
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// 本地可选依赖进入运行时类路径，不作为发布给使用者的依赖声明
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// 兼容测试模组从命令行指定的外部目录读取，不把本机路径或第三方 Jar 写入仓库
def compatModsDirProperty = providers.gradleProperty('fbmCompatModsDir').orNull
def compatModsInclude = providers.gradleProperty('fbmCompatModsInclude').getOrElse('*.jar')
def compatRuntimeJars = []

if (compatModsDirProperty != null && !compatModsDirProperty.isBlank()) {
    def compatModsDir = file(compatModsDirProperty)
    if (!compatModsDir.isDirectory()) {
        logger.lifecycle("FBM compatibility runtime directory does not exist; continuing without local mods: ${compatModsDir}")
    } else {
        compatRuntimeJars = fileTree(compatModsDir) {
            include compatModsInclude
        }.files.findAll {
            it.isFile() && it.name.toLowerCase(java.util.Locale.ROOT).endsWith('.jar')
        }.sort { left, right ->
            compatModsDir.toPath().relativize(left.toPath()).toString()
                    <=> compatModsDir.toPath().relativize(right.toPath()).toString()
        }

        if (compatRuntimeJars.isEmpty()) {
            logger.lifecycle("FBM compatibility runtime found no files matching '${compatModsInclude}' in ${compatModsDir}; continuing without local mods")
        } else {
            logger.lifecycle("FBM compatibility runtime loading ${compatRuntimeJars.size()} local mod(s): ${compatRuntimeJars*.name.join(', ')}")
        }
    }
}

dependencies {
    if (!compatRuntimeJars.isEmpty()) {
        localRuntime files(compatRuntimeJars)
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

// 元数据模板使用项目属性展开；缺失属性会使资源生成失败
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Gradle 构建与 IDE 同步共用同一份生成元数据
sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

// Maven 发布目标为项目内 repo 目录，执行构建不会自动发布
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

// 源码统一使用 UTF-8，确保中文注释和字符串采用一致编码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// IDEA 同步时下载依赖源码和 Javadoc，便于核对当前版本 API
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
