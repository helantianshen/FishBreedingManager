# 本模板由 generateModMetadata 展开，属性值来自 gradle.properties
modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

# 当前 Jar 声明的模组身份与展示信息
[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

# 模组列表中的产品说明，内容属于展示文案
description='''
Fish Breeding Manager (FBM) — a world-level, data-driven, hot-reloadable fish breeding
management framework for Minecraft 1.21.1 NeoForge. Adds configurable vanilla-style
breeding behavior to vanilla and third-party fish entities without modifying their classes.
'''

# NeoForge 与 Minecraft 均为客户端和服务端必需依赖
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
